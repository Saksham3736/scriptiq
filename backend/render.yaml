services:
  - type: web
    name: scriptiq-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: Agent_Doctor
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: scriptiq.sk@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SENDER_EMAIL
        value: scriptiq.sk@gmail.com
